<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Styled Web Page</title>
</head>
<body>
    <div class="container">
        <h1>Welcome to My Web Page</h1>
        <p>This is an example of a web page designed with various CSS styles.</p>
        <div class="border-box">
            <h2>Border Box Example</h2>
            <p>This box has a solid border.</p>
        </div>
        <div class="dashed-box">
            <h2>Dashed Border Box</h2>
            <p>This box has a dashed border.</p>
        </div>
        <div class="rounded-box">
            <h2>Rounded Border Box</h2>
            <p>This box has rounded corners and a thick border.</p>
        </div>
    </div>
</body>
</html>
